<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAKATATOR.EXE</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="desktop">
    <div class="desktop-icons">
        <div class="icon" data-mode="spin">
            <img src="/static/icon-spin.png" alt="" class="icon-img">
            <div class="icon-label">Выбрать подарок</div>
        </div>
        
        <div class="icon" data-mode="certificate">
            <img src="/static/icon-certificate.png" alt="" class="icon-img">
            <div class="icon-label">Подарить сертификат</div>
        </div>
        
        <div class="icon" data-mode="goals">
            <img src="/static/icon-goals.png" alt="" class="icon-img">
            <div class="icon-label">Скинуться на великое</div>
        </div>
    </div>
    
    <div class="clippy-container">
        <div class="clippy-box">
            <div class="clippy-text" id="clippy-text">
                Привет! Я Срепыч! Выбери иконку чтобы начать! 🎁
            </div>
            <img src="/static/clippy.png" alt="Срепыч" class="clippy-character">
        </div>
    </div>
    
    <div class="modal-overlay" id="modal-overlay" style="display: none;">
        <div class="modal-window" id="modal-window">
            <div class="window-titlebar">
                <span class="window-title" id="modal-title">🎲 Выбрать подарок</span>
                <button class="win-btn close" id="modal-close">✕</button>
            </div>
            <div class="modal-content">
                <div class="split-layout">
                    <div class="left-panel" id="left-panel">
                        <label>Бюджет (₽):</label>
                        <input type="number" id="budget" class="win95" value="5000" min="100" step="100">
                        
                        <label>Категория:</label>
                        <select id="category" class="win95">
                            <option value="">Любая</option>
                            <option value="Туризм">Туризм</option>
                            <option value="Инструмент">Инструмент</option>
                            <option value="Электроника">Электроника</option>
                            <option value="Сад">Сад</option>
                        </select>
                        
                        <div style="margin-top: 30px;">
                            <button id="btn-spin-execute" class="win95" style="width: 100%; margin: 5px 0;">🎲 Подобрать случайный подарок</button>
                            <button id="btn-show-all" class="win95" style="width: 100%; margin: 5px 0; background: #008000; color: white;">📋 Показать доступные</button>
                            <button id="btn-form-close" class="win95" style="width: 100%; margin: 5px 0;">Закрыть</button>
                        </div>
                    </div>
                    
                    <div class="right-panel">
                        <div class="action-bar" id="action-bar" style="display: none;">
                            <div class="stats-panel">
                                Выбрано: <strong id="stats-count">0</strong> шт на сумму <strong id="stats-total">0</strong>₽
                            </div>
                            <div class="action-buttons">
                                <button id="btn-copy" class="win95" style="background: #008000; color: white;">✅ Подтвердить и скопировать</button>
                                <button id="btn-reroll" class="win95">🔄 Ещё разок</button>
                            </div>
                            <p style="margin: 10px 0 0 0; font-size: 13px; color: #666;">
                                💡 Отметь галочкой что оставить
                            </p>
                        </div>
                        <div id="result-content" style="margin-top: 20px;">
                            <p style="color: #808080; text-align: center; padding: 40px;">
                                Нажми "Подобрать случайный подарок"<br>или "Показать доступные"
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="/static/js/app.js"></script>
</body>
</html>
