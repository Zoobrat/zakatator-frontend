<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎁 Закататор подарков</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎁 Закататор подарков</h1>
        <p class="subtitle">Загрузи вишлист — получи подарок!</p>

        <!-- Загрузка файла -->
        <div class="upload-section">
            <label for="wishlist" class="upload-label">
                📁 Выбери файл (TXT, PDF, DOCX)
            </label>
            <input type="file" id="wishlist" accept=".txt,.pdf,.docx">
            <button onclick="uploadWishlist()" class="btn-primary">🚀 Загрузить</button>
        </div>

        <!-- Прогресс -->
        <div id="progress" class="progress-section" style="display: none;">
            <img src="icon-spin.png" class="spinner" alt="Loading">
            <p>Обработка вишлиста...</p>
        </div>

        <!-- Результат -->
        <div id="result" class="result-section" style="display: none;">
            <img src="icon-certificate.png" class="result-icon" alt="Gift">
            <h2>🎉 Твой подарок:</h2>
            <p id="gift-text" class="gift-text"></p>
            <button onclick="resetApp()" class="btn-secondary">🔄 Ещё раз</button>
        </div>

        <!-- Ошибка -->
        <div id="error" class="error-section" style="display: none;">
            <img src="icon-goals.png" class="error-icon" alt="Error">
            <p id="error-text" class="error-text"></p>
            <button onclick="resetApp()" class="btn-secondary">🔄 Попробовать снова</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
